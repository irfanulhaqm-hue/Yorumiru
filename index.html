<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1014"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="styles.css"><title>Yorumiru</title></head>
<body>
<header><div><b>YORUMIRU</b><small>YOUR ANIME JOURNAL</small></div><button id="add" aria-label="Add anime">＋</button></header>
<main>
<section class="hero"><div><small>MY WATCHLIST</small><h1>Keep your story<br><i>moving.</i></h1></div><div id="stats"></div></section>
<nav id="filters">
<button class="on" data-f="all">All</button><button data-f="watching">Watching</button><button data-f="planned">Planned</button><button data-f="completed">Completed</button><button data-f="favorites">♥ Favorites</button>
</nav>
<section id="list"></section>
<section id="empty" class="empty"><strong>✦</strong><h2>Your watchlist is empty</h2><p>Add the anime you want to track.</p><button class="primary" id="emptyAdd">Add your first anime</button></section>
</main>

<dialog id="addDlg"><div id="addPane">
<button class="x" id="close">×</button>
<small class="label">ADD ANIME</small><h2>Find your anime</h2>
<label>Search<input id="search" autocomplete="off" placeholder="e.g. Attack on Titan"></label>
<div id="results"></div>
<div id="selected" class="selected hidden"></div>
<div class="actions"><button class="secondary" id="cancel">Cancel</button></div>
</div></dialog>

<dialog id="detailDlg"><div id="detail"></div></dialog>
<script src="app.js"></script></body></html>
